name: check

on:
  push:
    branches: [main, maintenance-pi0851]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Update compatibility docs
        if: github.ref == 'refs/heads/maintenance-pi0851'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = 'Checks use the pinned Pi 0.84.3 packages, including real CLI foreground delegation and background RPC notification tests against a local fake model endpoint. Those smoke tests also pass on Pi 0.85.1; no live model calls are needed.'
          new = 'Checks use the pinned Pi 0.85.1 packages, including real CLI foreground delegation and background RPC notification tests against a local fake model endpoint. No live model calls are needed.'
          if old not in text and new not in text:
            raise SystemExit('README compatibility paragraph not found')
          path.write_text(text.replace(old, new))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: bun install
      - run: bun run check
      - run: git diff --check
      - name: Commit generated maintenance changes
        if: github.ref == 'refs/heads/maintenance-pi0851'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add bun.lock README.md
            git commit -m 'chore(deps): refresh Pi compatibility files [skip ci]'
            git push
          fi
